# ВАЖНО для этой ветки: значения отсюда перебиваются полями из TunnelConfig. Их кладут в
# начало окружения Spring при запуске, поэтому правка этого файла на запуск не повлияет —
# менять надо TunnelConfig. Файл остаётся нижним слоем: он задаёт значения по умолчанию для
# всего, чего в TunnelConfig нет, и для запуска собранного jar чем-то кроме TunnelApplication.

server:
  port: 8080

spring:
  main:
    banner-mode: "off"

tunnel:
  # Общий секрет, который клиент шлёт в заголовке X-Tunnel-Auth. Пусто = вход открыт
  # (только для разработки). Перебивается полем AUTH или переменной TUNNEL_AUTH.
  auth: ""
  # Путь, на котором висит WebSocket-эндпойнт; если в URL пути нет, клиент добавит его сам.
  path: /tunnel
  # Куда клиентам можно дозваниваться: регулярки по "host:port" для прямых потоков и по
  # "R:bind:port" для обратных слушателей. Пусто = куда угодно, докуда достаёт сервер.
  # Пример для цепочки через прокси (один путь внутрь, один обратно):
  #   allow:
  #     - "^127\\.0\\.0\\.1:3129$"
  #     - "^R:0\\.0\\.0\\.0:3130$"
  allow: []
  # Отдавать туннель ещё и по обычному HTTP, на {path}/http, — для клиентов в сетях, где
  # переход на WebSocket не переживает дороги. false оставит только WebSocket-эндпойнт
  # (поле HTTP_FALLBACK в TunnelConfig).
  http-fallback: true
  # Как часто пинговать каждого клиента. Ноль выключает серверный keepalive вместе
  # с отстрелом замолчавших сессий.
  keepalive: 25s
  # Молчание, после которого клиент считается пропавшим: его сессия закрывается, а обратные
  # слушатели освобождаются, чтобы тот же клиент смог занять их снова при переподключении.
  pong-timeout: 75s

logging:
  level:
    root: INFO
    com.laptopkit.tunnel: INFO
